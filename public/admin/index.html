<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Administrador de contenido</title>
  </head>
  <body>
    <!--
      Netlify Identity se usa únicamente para autenticar el CMS (Git Gateway).
      El sitio público puede estar en Vercel; solo hace falta un sitio Netlify
      gratuito conectado al mismo repositorio de GitHub con Identity y
      Git Gateway habilitados.

      TU_SITIO_NETLIFY aquí DEBE coincidir con identity_url/gateway_url de
      public/admin/config.yml. Reemplazar por el dominio *.netlify.app real.
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({
          APIUrl: "https://TU_SITIO_NETLIFY.netlify.app/.netlify/identity",
        });
      }
    </script>

    <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
  </body>
</html>
