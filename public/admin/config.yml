backend:
  name: git-gateway
  branch: main
  squash_merges: true
  # El sitio público vivirá en Vercel; el login del CMS (Identity + Git
  # Gateway) se sirve desde el sitio Netlify coegioweb.
  identity_url: https://coegioweb.netlify.app/.netlify/identity
  gateway_url: https://coegioweb.netlify.app/.netlify/git

# Workflow editorial: los borradores viven en una rama y "Publicar" hace merge
# a main (lo que dispara el rebuild automático de Vercel).
publish_mode: editorial_workflow

# Dominio público real. Temporal: Netlify (aún no hay Vercel).
site_url: https://coegioweb.netlify.app
display_url: https://coegioweb.netlify.app
logo_url: /branding/logo.svg

# Carpeta donde Decap CMS guarda los archivos multimedia que se suban desde
# el editor. Se sirven como rutas públicas en /media/... .
media_folder: public/media/uploads
public_folder: /media/uploads

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: noticias
    label: Noticias
    label_singular: Noticia
    folder: src/content/noticias
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    media_folder: public/media/noticias
    public_folder: /media/noticias
    editor:
      preview: false
    fields:
      - {
          label: "Slug (URL)",
          name: slug,
          widget: string,
          pattern:
            [
              "^[a-z0-9]+(?:-[a-z0-9]+)*$",
              "Solo minúsculas, números y guiones. Sin espacios ni tildes.",
            ],
          required: true,
        }
      - { label: "Título", name: titulo, widget: string, required: true }
      - { label: "Resumen", name: resumen, widget: text, required: false }
      - {
          label: "Imagen de portada",
          name: imagenPath,
          widget: image,
          required: false,
          media_folder: public/media/noticias,
          public_folder: /media/noticias,
          choose_url: true,
        }
      - {
          label: "Texto alternativo de la imagen",
          name: imagenAlt,
          widget: string,
          required: false,
        }
      - { label: "Autor", name: autor, widget: string, required: false }
      - {
          label: "Fecha de publicación",
          name: publicadoEn,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          picker_utc: true,
          required: true,
        }
      - { label: "Contenido", name: body, widget: markdown, required: true }

  - name: circulares
    label: Circulares
    label_singular: Circular
    folder: src/content/circulares
    create: true
    slug: "{{titulo}}"
    extension: md
    format: frontmatter
    media_folder: public/media/circulares
    public_folder: /media/circulares
    editor:
      preview: false
    fields:
      - { label: "Título", name: titulo, widget: string, required: true }
      - {
          label: "Descripción",
          name: descripcion,
          widget: text,
          required: false,
        }
      - { label: "Categoría", name: categoria, widget: string, required: false }
      - {
          label: "Fecha",
          name: fecha,
          widget: date,
          format: "YYYY-MM-DD",
          required: true,
        }
      - {
          label: "Archivo adjunto",
          name: archivoPath,
          widget: file,
          required: false,
          media_folder: public/media/circulares,
          public_folder: /media/circulares,
          choose_url: true,
        }
      - {
          label: "Nombre del archivo",
          name: archivoNombre,
          widget: string,
          required: false,
        }
      - {
          label: "Fecha de publicación",
          name: publicadoEn,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          picker_utc: true,
          required: true,
        }

  - name: paginas
    label: "Textos de página"
    label_singular: "Texto de página"
    files:
      - name: inicio
        label: Inicio
        file: src/content/paginas/inicio.md
        fields:
          - { label: "Slug", name: slug, widget: string, required: true }
          - { label: "Título", name: titulo, widget: string, required: true }
          - {
              label: "Descripción",
              name: descripcion,
              widget: text,
              required: false,
            }
          - {
              label: "Contenido",
              name: contenido,
              widget: markdown,
              required: false,
            }

      - name: nosotros
        label: Nosotros
        file: src/content/paginas/nosotros.md
        fields:
          - { label: "Slug", name: slug, widget: string, required: true }
          - { label: "Título", name: titulo, widget: string, required: true }
          - {
              label: "Descripción",
              name: descripcion,
              widget: text,
              required: false,
            }
          - {
              label: "Contenido",
              name: contenido,
              widget: markdown,
              required: false,
            }

      - name: admisiones
        label: Admisiones
        file: src/content/paginas/admisiones.md
        fields:
          - { label: "Slug", name: slug, widget: string, required: true }
          - { label: "Título", name: titulo, widget: string, required: true }
          - {
              label: "Descripción",
              name: descripcion,
              widget: text,
              required: false,
            }
          - {
              label: "Contenido",
              name: contenido,
              widget: markdown,
              required: false,
            }

      - name: niveles
        label: Niveles educativos
        file: src/content/paginas/niveles.md
        fields:
          - { label: "Slug", name: slug, widget: string, required: true }
          - { label: "Título", name: titulo, widget: string, required: true }
          - {
              label: "Descripción",
              name: descripcion,
              widget: text,
              required: false,
            }
          - {
              label: "Contenido",
              name: contenido,
              widget: markdown,
              required: false,
            }

      - name: contacto
        label: Contacto
        file: src/content/paginas/contacto.md
        fields:
          - { label: "Slug", name: slug, widget: string, required: true }
          - { label: "Título", name: titulo, widget: string, required: true }
          - {
              label: "Descripción",
              name: descripcion,
              widget: text,
              required: false,
            }
          - {
              label: "Contenido",
              name: contenido,
              widget: markdown,
              required: false,
            }

  - name: galeria
    label: Galería
    label_singular: Imagen
    folder: src/content/galeria
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    media_folder: public/media/galeria
    public_folder: /media/galeria
    editor:
      preview: false
    fields:
      - { label: "Slug (URL)", name: slug, widget: string, required: true }
      - { label: "Título", name: titulo, widget: string, required: false }
      - { label: "Categoría", name: categoria, widget: string, required: false }
      - {
          label: "Imagen",
          name: imagenPath,
          widget: image,
          required: true,
          media_folder: public/media/galeria,
          public_folder: /media/galeria,
          choose_url: true,
        }
      - {
          label: "Texto alternativo",
          name: imagenAlt,
          widget: string,
          required: true,
        }
      - {
          label: "Orden",
          name: orden,
          widget: number,
          value_type: int,
          default: 0,
          required: true,
        }
      - {
          label: "Fecha de publicación",
          name: publicadoEn,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          picker_utc: true,
          required: false,
        }
